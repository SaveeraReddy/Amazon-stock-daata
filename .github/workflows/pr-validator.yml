name: PR Quality and Test Checks

on:
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Lint Tools
      run: pip install -r .github/workflows/requirements.txt

    - name: Get Changed Files in PR
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --paginate \
          "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
          --jq '.[] | select(.status != "removed") | .filename' > changed_files.txt

        grep -E '\.py$'    changed_files.txt | grep -v '.github/workflows' > py_files.txt    || true
        grep -E '\.ipynb$' changed_files.txt | grep -v '.github/workflows' > ipynb_files.txt || true

        echo "== Python =="    ; cat py_files.txt    || true
        echo "== Notebooks ==" ; cat ipynb_files.txt || true

    - name: Syntax Check (.py)  [FAIL on error]
      run: |
        if [ -s py_files.txt ]; then
          xargs -a py_files.txt -d '\n' flake8 \
            --config=.github/workflows/.flake8 \
            --select=E9,F63,F7,F82 --show-source --statistics
        else
          echo "No .py files to syntax-check."
        fi

    - name: Syntax Check (.ipynb notebooks)  [FAIL on error]
      run: |
        if [ -s ipynb_files.txt ]; then
          xargs -a ipynb_files.txt -d '\n' nbqa flake8 \
            --config=.github/workflows/.flake8 \
            --select=E9,F63,F7,F82 --show-source --statistics
        else
          echo "No notebooks to syntax-check."
        fi

    - name: Unused Imports (.py)
      if: always()
      run: |
        if [ -s py_files.txt ]; then
          xargs -a py_files.txt -d '\n' flake8 \
            --config=.github/workflows/.flake8 \
            --exit-zero --select=F401 --show-source --statistics
        else
          echo "No .py files."
        fi

    - name: Unused Imports (.ipynb)
      if: always()
      run: |
        if [ -s ipynb_files.txt ]; then
          xargs -a ipynb_files.txt -d '\n' nbqa flake8 \
            --config=.github/workflows/.flake8 \
            --exit-zero --select=F401 --show-source --statistics
        else
          echo "No notebooks."
        fi
    - name: Custom Validator (utility import + try/except)
      if: always()
      run: |
        cat py_files.txt ipynb_files.txt > all_files.txt 2>/dev/null || true
        if [ -s all_files.txt ]; then
          xargs -a all_files.txt -d '\n' python .github/workflows/validator.py
        else
          echo "No files to validate."
        fi