name: PR Quality and Test Checks

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Debug repository contents
      run: |
        echo "Current branch:"
        git branch --show-current

        echo ""
        echo "Files in repository:"
        find . -maxdepth 2 -type f

        echo ""
        echo "Git tracked files:"
        git ls-files
    - name: Show changed files
      run: |
        git diff --name-only origin/${{ github.base_ref }}...HEAD
    - name: Install Gitleaks
      run: |
        GITLEAKS_VERSION=8.24.2
        wget https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
        tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
        sudo mv gitleaks /usr/local/bin/

    - name: Get changed files
      run: |
        git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt

    - name: Run Gitleaks on changed files
      run: |
        while IFS= read -r file; do
        if [ -f "$file" ]; then
          echo "Scanning $file"
          gitleaks detect --source "$file" --no-git --verbose
      fi
    done < changed_files.txt

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Databricks Testing Tools
      run: |
        pip install -r .github/workflows/requirements.txt

    - name: Run Code Quality Check (Syntax Errors)
      run: |
        flake8 . --config=.github/workflows/.flake8 --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Get Changed Python Files in PR
      id: changed-files
      run: |
        FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD | grep '\.py$' | tr '\n' ' ' || true)
        echo "PR_FILES=$FILES" >> $GITHUB_ENV

    - name: Run Code Quality Check (Warnings for Unused Imports)
      run: |
        if [ -z "${{ env.PR_FILES }}" ]; then
          echo "No Python files modified in this PR. Skipping unused imports check."
        else
          flake8 ${{ env.PR_FILES }} --config=.github/workflows/.flake8 --count --exit-zero --select=F401 --show-source --statistics
        fi

    - name: Run Custom Validator
      run: |
        if [ -z "${{ env.PR_FILES }}" ]; then
          echo "No Python files modified in this PR. Skipping custom validation."
        else
          python .github/workflows/validator.py ${{ env.PR_FILES }}
        fi