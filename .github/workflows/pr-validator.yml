name: PR Quality and Test Checks

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    ####################################################
    # Checkout
    ####################################################
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    ####################################################
    # Install Gitleaks
    ####################################################
    - name: Install Gitleaks
      run: |
        GITLEAKS_VERSION=8.24.2
        wget https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
        tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
        sudo mv gitleaks /usr/local/bin/

    ####################################################
    # Secret Scan
    ####################################################
    - name: Run Gitleaks Secret Scan
      run: |
        gitleaks detect \
          --source \
          --no-git \
          --verbose

    ####################################################
    # Setup Python
    ####################################################
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: "pip"

    ####################################################
    # Install Requirements
    ####################################################
    - name: Install Databricks Testing Tools
      run: |
        pip install -r .github/workflows/requirements.txt

    ####################################################
    # Syntax Check
    ####################################################
    - name: Run Syntax Check
      run: |
        flake8 . \
          --config=.github/workflows/.flake8 \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics

    ####################################################
    # Get Changed Python Files
    ####################################################
    - name: Get Changed Python Files
      run: |
        FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD | grep '\.py$' | tr '\n' ' ' || true)

        echo "Changed Python files:"
        echo "$FILES"

        echo "PR_FILES=$FILES" >> $GITHUB_ENV

    ####################################################
    # Flake8 Warnings
    ####################################################
    - name: Run Flake8 (Unused Imports)
      run: |
        if [ -z "${{ env.PR_FILES }}" ]; then
          echo "No Python files changed."
        else
          flake8 ${{ env.PR_FILES }} \
            --config=.github/workflows/.flake8 \
            --count \
            --exit-zero \
            --select=F401 \
            --show-source \
            --statistics
        fi

    ####################################################
    # Custom Validator
    ####################################################
    - name: Run Custom Validator
      run: |
        if [ -z "${{ env.PR_FILES }}" ]; then
          echo "No Python files changed."
        else
          python .github/workflows/validator.py ${{ env.PR_FILES }}
        fi